services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hidrocalida
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hidrocalida"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - apps/backend/.env
    environment:
      # Local docker-compose siempre habla con el Postgres/Redis del propio
      # compose, nunca con Neon/Railway, sin importar lo que diga backend/.env.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hidrocalida
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
